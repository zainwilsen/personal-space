# Project-wide Gradle settings tuned for reliability and deterministic memory footprint
# Memory is deliberately conservative: this sandbox has ~2 GB of RAM total, and KSP + the Kotlin
# compiler + the Android resource pipeline all live in the same JVM. The previous 1536m heap plus a
# 768m metaspace let the daemon get OOM-killed mid-build, which surfaces as the confusing
# "build daemon disappeared unexpectedly".
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true

# AndroidX & Jetpack Compose
android.useAndroidX=true
android.nonTransitiveRClass=true
ksp.incremental=true
