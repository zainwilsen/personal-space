name: Build Release APK

# Kya karta hai:
#   1. project compile karta hai
#   2. poore unit tests chalata hai (263 tests) — fail hone par APK nahi banti
#   3. release APK banata hai, AAPKI existing debug keystore se sign karta hai
#   4. verify karta hai ki signing key purane APK se SAME hai (warna upgrade fail hota)
#   5. APK ko artifact + Release me upload kar deta hai
#
# Zaroori secret ek hi hai: KEYSTORE_BASE64 (setup neeche GITHUB_ACTIONS_SETUP.md me).

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'verification/**'
      - 'apk/**'
  workflow_dispatch:        # Actions tab se manually bhi chala sakte ho

permissions:
  contents: write           # Release banane ke liye

jobs:
  build:
    # Ubuntu runner me 4 cores / 16 GB RAM hoti hai — local sandbox ki 1.9 GB se kaafi zyada
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: PersonalSpace-GitHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # ---------------------------------------------------------------- toolchain
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # gradle-wrapper.properties se hi version lega (8.10.2)
          cache-read-only: false

      # ---------------------------------------------------------------- cache
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-3
            ~/.gradle/caches/jars-9
          key: gradle-${{ runner.os }}-${{ hashFiles('PersonalSpace-GitHub/**/*.gradle.kts', 'PersonalSpace-GitHub/gradle/libs.versions.toml', 'PersonalSpace-GitHub/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ---------------------------------------------------------------- signing key
      # Sabse important step. Iske bina APK naye random key se sign ho jayegi,
      # upgrade fail hoga aur device par installed app ka data dikhega nahi.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error title=KEYSTORE_BASE64 missing::Repository secret 'KEYSTORE_BASE64' set nahi hai. GITHUB_ACTIONS_SETUP.md dekho. Iske bina build ruk jayega — kyunki galat key se sign hui APK upgrade nahi hoti aur user ka vault kho sakta hai."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          # keystore sach me valid hai?
          keytool -list -keystore "$HOME/.android/debug.keystore" \
                  -storepass android -alias androiddebugkey > /dev/null \
            || { echo "::error::Keystore corrupt hai ya password 'android' nahi hai."; exit 1; }

          echo "Keystore restored:"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
                  -storepass android -alias androiddebugkey \
            | grep -E "SHA1:|SHA256:|Owner:" | sed 's/^/  /'

      - name: local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ---------------------------------------------------------------- tests
      # Item 7 of the project's own rules: no APK without an executed test suite.
      - name: Prepare verification evidence directory
        run: |
          sudo mkdir -p /home/user/verification/evidence
          sudo chown -R "$(id -u):$(id -g)" /home/user/verification

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --console=plain

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: PersonalSpace-GitHub/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, re, os
          tot = fail = 0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', open(f).read())
              if m:
                  t, sk, fa, er = map(int, m.groups())
                  tot += t; fail += fa + er
          print("## Test results")
          print(f"**{tot} tests, {fail} failures**")
          print("")
          print("PASS" if fail == 0 and tot > 0 else "FAIL")
          PY

      # ---------------------------------------------------------------- build
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease --console=plain

      # ---------------------------------------------------------------- verify
      # Ye step woh galti pakadta hai jiski wajah se app upgrade nahi hota.
      - name: Verify APK (version + signing key)
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK bani nahi"; exit 1; }

          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          AAPT2="$BUILD_TOOLS/aapt2"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          echo "=== Badging ==="
          "$AAPT2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion" | tee badging.txt

          PKG=$(grep -oP "package: name='\K[^']+" badging.txt)
          VCODE=$(grep -oP "versionCode='\K[0-9]+" badging.txt)
          VNAME=$(grep -oP "versionName='\K[^']+" badging.txt)

          # version build.gradle.kts se match hona chahiye
          EXPECTED_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          EXPECTED_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)

          echo "APK      : $PKG $VNAME ($VCODE)"
          echo "Expected : app.personalspace.vault $EXPECTED_NAME ($EXPECTED_CODE)"

          [ "$PKG" = "app.personalspace.vault" ] || { echo "::error::package name galat: $PKG"; exit 1; }
          [ "$VCODE" = "$EXPECTED_CODE" ]       || { echo "::error::versionCode mismatch"; exit 1; }
          [ "$VNAME" = "$EXPECTED_NAME" ]       || { echo "::error::versionName mismatch"; exit 1; }

          echo "=== Signature ==="
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt

          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -oP "SHA-256 digest: \K[0-9a-f]+" | head -1)

          # Ye woh key hai jo purani APK (1.3.0 / 1.4.0) ko sign karti thi.
          # Badal gayi to upgrade `INSTALL_FAILED_UPDATE_INCOMPATIBLE` deta hai.
          EXPECTED_SHA256="9eba3d85da9457f3b06317d72a716526afa73127c1ee08d2336eb9d56bac8d04"
          echo "APK cert SHA-256      : $CERT_SHA256"
          echo "Expected (same as v1.3/v1.4): $EXPECTED_SHA256"

          if [ "$CERT_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error title=Signing key badal gayi::APK ka certificate SHA-256 purane builds se alag hai. Is APK se upgrade NAHI hoga, aur install karne ke liye uninstall karna padega — jisse user ka vault delete ho jata hai. KEYSTORE_BASE64 check karo."
            exit 1
          fi
          echo "::notice::Signing key purane APK se identical hai — upgrade safe hai."

          sha256sum "$APK" | tee apk-sha256.txt
          ls -l "$APK"

      - name: Rename APK
        run: |
          VNAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/PersonalSpace_v${VNAME}-release.apk"
          echo "APK_NAME=PersonalSpace_v${VNAME}-release.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalSpace-release-apk
          path: PersonalSpace-GitHub/app/build/outputs/apk/release/PersonalSpace_v*-release.apk
          retention-days: 90

      - name: Upload verification files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-verification
          path: |
            PersonalSpace-GitHub/badging.txt
            PersonalSpace-GitHub/certs.txt
            PersonalSpace-GitHub/apk-sha256.txt
          if-no-files-found: ignore

      # ---------------------------------------------------------------- release
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Personal Space ${{ github.run_number }}
          body: |
            Automated release build.

            - APK: `${{ env.APK_NAME }}`
            - Signing key verified identical to previous releases (upgrade-safe)
            - Full unit test suite executed before the build
          files: PersonalSpace-GitHub/app/build/outputs/apk/release/PersonalSpace_v*-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
